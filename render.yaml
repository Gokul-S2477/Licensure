services:
  - type: web
    name: license-management-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: license-management-db
          property: connectionString
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false

  - type: web
    name: license-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: license-management-db
    plan: free
    databaseName: license_management
    user: lms
